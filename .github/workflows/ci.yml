name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: macOS build / test / golden
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check（含 desktop crate 的图标/context 校验）
        run: cargo check --workspace --all-targets

      - name: cargo test（黄金夹具在 indicator-golden 内，失败即红）
        run: cargo test --workspace --exclude aka-desktop -- --nocapture

      - name: 黄金回归报告（T-03 门禁，失败打印首个偏差下标）
        run: cargo test -p indicator-golden -- --nocapture

      - name: npm ci
        run: npm ci

      - name: 常量单一源门禁（G1，不一致即红）
        run: npm run verify:constants

      # 内容库 app/content/indicators/ 由 S-03.03-03 交付；未交付前本步骤预期 red（exit 2）。
      # 交付触发条件与翻阻断要求见 docs/qa/aka-tech-debt-s0-v0.1.md 的 TD-S3-02。
      - name: 指标口径页门禁（W-03）——预期失败，不阻断
        continue-on-error: true
        run: |
          echo "EXPECTED RED until S-03.03-03: app/content/indicators/ 未交付，verify:docs 会 exit 2"
          npm run verify:docs

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vite build
        run: npm run build

      - name: 前端构建产物存在性
        run: test -f dist/index.html

name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: macOS build / test / golden
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check（含 desktop crate 的图标/context 校验）
        run: cargo check --workspace --all-targets

      - name: cargo test（黄金夹具在 indicator-golden 内，失败即红）
        run: cargo test --workspace --exclude aka-desktop -- --nocapture

      - name: 黄金回归报告（T-03 门禁，失败打印首个偏差下标）
        run: cargo test -p indicator-golden -- --nocapture

      # W-34 / TD-BENCH-01：夹具或注册表变了却忘记同提交重生成快照，这里会红。
      # 可复现性由 W-33 保证：快照内墙钟字段（computedMs / generatedAt）已归零。
      # 失败时必须能直接看出差在哪：先 --stat，再点名首个差异文件，最后仍以 --exit-code 收尾。
      - name: bench 快照可复现门禁（W-34 / TD-BENCH-01）
        working-directory: .
        run: |
          cargo run -p indicator-golden --manifest-path app/Cargo.toml --bin aka-aggregate-export
          if git diff --quiet app/bench/aggregates app/bench/ipc-snapshots; then
            echo "快照可复现：export 产物与仓库基线一致"
            exit 0
          fi
          echo "::error::bench 快照漂移：夹具/注册表变了必须同提交重生成"
          git diff --stat app/bench/aggregates app/bench/ipc-snapshots
          echo "首个差异文件：$(git diff --name-only app/bench/aggregates app/bench/ipc-snapshots | head -n 1)"
          git diff --exit-code app/bench/aggregates app/bench/ipc-snapshots

      - name: npm ci
        run: npm ci

      - name: 常量单一源门禁（G1，不一致即红）
        run: npm run verify:constants

      # 内容库 app/content/indicators/ 由 S-03.03-03 交付；未交付前本步骤预期 red（exit 2）。
      # 交付触发条件与翻阻断要求见 docs/qa/aka-tech-debt-s0-v0.1.md 的 TD-S3-02。
      - name: 指标口径页门禁（W-03）——预期失败，不阻断
        continue-on-error: true
        run: |
          echo "EXPECTED RED until S-03.03-03: app/content/indicators/ 未交付，verify:docs 会 exit 2"
          npm run verify:docs

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vite build
        run: npm run build

      - name: 前端构建产物存在性
        run: test -f dist/index.html

      # W-63：导出分支注入是 dev-only。
      # 两件不同的事分开：这里的静态零命中检查跑的是 release（production dist）产物；
      # 四支运行时证据跑的是 dev 模式产物（meta 记 mode=dev），二者不能互相替代。
      - name: 导出注入仅 dev（W-63，release 产物）
        run: |
          if grep -R -q -- 'aka.diag.export' dist; then
            echo "::error::release 前端产物含 dev-only 导出注入键 aka.diag.export（W-63）"
            grep -R -n -- 'aka.diag.export' dist | head -n 5
            exit 1
          fi
          echo "导出注入仅 dev：release 产物 0 命中（运行时四支证据另见 dev 包）"

      # W-64 源码层门禁：清单全部从源码派生（命令全集 / 行为判定的诊断命令 /
      # 字面量逐位置 cfg 覆盖 / 写盘物质不变量），不再维护手写名字表。
      - name: 诊断入口源码层门禁（W-49 / W-58 / W-64）
        run: node scripts/verify-diag-gate.mjs

      # W-49：release 二进制不得残留 QA 注入入口。
      # 符号表来自 `--emit-symbols`（源码派生），ci.yml 不再有第二份手写列表；
      # 每个符号独立断言，子串扣减也由脚本输出，避免一条掩盖其余。
      # 计数用 grep -o 而非 -c（0 命中时 grep 自身 exit 1）；
      # 不用「非标识符边界」匹配：macOS 二进制里相邻字面量会被合并，边界匹配会漏检。
      - name: release 注入符号门禁（W-49 / W-64）
        run: |
          cargo build --release -p aka-desktop
          BIN=target/release/aka-desktop
          strings "$BIN" > /tmp/aka-release-strings.txt
          node scripts/verify-diag-gate.mjs --emit-symbols > /tmp/aka-diag-symbols.tsv
          echo "派生诊断符号（源码 → 产物对账）："
          cut -f1 /tmp/aka-diag-symbols.tsv
          raw_count() { (grep -a -o -F -- "$1" /tmp/aka-release-strings.txt || true) | wc -l | tr -d ' '; }
          fail=0
          while IFS=$'\t' read -r symbol supersets; do
            [ -n "$symbol" ] || continue
            count=$(raw_count "$symbol")
            if [ -n "$supersets" ]; then
              old_ifs=$IFS
              IFS=','
              for longer in $supersets; do
                count=$((count - $(raw_count "$longer")))
              done
              IFS=$old_ifs
            fi
            echo "diag symbol [$symbol] count=$count (expect 0)"
            if [ "$count" -ne 0 ]; then
              fail=1
              echo "::error::release 二进制含注入符号 $symbol（$count 处）"
              echo "--- $symbol 命中行 ---"
              grep -a -n -F -- "$symbol" /tmp/aka-release-strings.txt | head -n 30
            fi
          done < /tmp/aka-diag-symbols.tsv
          exit "$fail"

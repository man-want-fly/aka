name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: macOS build / test / golden
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check（含 desktop crate 的图标/context 校验）
        run: cargo check --workspace --all-targets

      - name: cargo test（黄金夹具在 indicator-golden 内，失败即红）
        run: cargo test --workspace --exclude aka-desktop -- --nocapture

      - name: 黄金回归报告（T-03 门禁，失败打印首个偏差下标）
        run: cargo test -p indicator-golden -- --nocapture

      # W-34 / TD-BENCH-01：夹具或注册表变了却忘记同提交重生成快照，这里会红。
      # 可复现性由 W-33 保证：快照内墙钟字段（computedMs / generatedAt）已归零。
      # 失败时必须能直接看出差在哪：先 --stat，再点名首个差异文件，最后仍以 --exit-code 收尾。
      - name: bench 快照可复现门禁（W-34 / TD-BENCH-01）
        working-directory: .
        run: |
          cargo run -p indicator-golden --manifest-path app/Cargo.toml --bin aka-aggregate-export
          if git diff --quiet app/bench/aggregates app/bench/ipc-snapshots; then
            echo "快照可复现：export 产物与仓库基线一致"
            exit 0
          fi
          echo "::error::bench 快照漂移：夹具/注册表变了必须同提交重生成"
          git diff --stat app/bench/aggregates app/bench/ipc-snapshots
          echo "首个差异文件：$(git diff --name-only app/bench/aggregates app/bench/ipc-snapshots | head -n 1)"
          git diff --exit-code app/bench/aggregates app/bench/ipc-snapshots

      - name: npm ci
        run: npm ci

      - name: 常量单一源门禁（G1，不一致即红）
        run: npm run verify:constants

      # 内容库 app/content/indicators/ 由 S-03.03-03 交付；未交付前本步骤预期 red（exit 2）。
      # 交付触发条件与翻阻断要求见 docs/qa/aka-tech-debt-s0-v0.1.md 的 TD-S3-02。
      - name: 指标口径页门禁（W-03）——预期失败，不阻断
        continue-on-error: true
        run: |
          echo "EXPECTED RED until S-03.03-03: app/content/indicators/ 未交付，verify:docs 会 exit 2"
          npm run verify:docs

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vite build
        run: npm run build

      - name: 前端构建产物存在性
        run: test -f dist/index.html

      # W-63：导出分支注入是 dev-only，release 产物必须零命中（源码守卫由上面的源码层门禁检查）。
      - name: 导出注入仅 dev（W-63）
        run: |
          if grep -R -q -- 'aka.diag.export' dist; then
            echo "::error::release 前端产物含 dev-only 导出注入键 aka.diag.export（W-63）"
            grep -R -n -- 'aka.diag.export' dist | head -n 5
            exit 1
          fi
          echo "导出注入仅 dev：生产产物 0 命中"

      # W-49 / W-58 源码层断言：产物 strings 为 0 只证当前实现过得了，证不了下次摘掉 cfg
      # 会被拦住。这里同时确认：release 的 invoke_handler 不含写命令、debug 仍注册（调试能力
      # 被误删也要拦）、diag_faults/diag_write/diag_write_named/write_diag 均被
      # cfg(debug_assertions) 覆盖。两层分工：产物层拦「符号进二进制」，源码层拦「入口被注册/漏 cfg」。
      # 符号表在 scripts/verify-diag-gate.mjs 内，与下面 symbol 列表保持同一份。
      - name: 诊断入口源码层门禁（W-49 / W-58）
        run: node scripts/verify-diag-gate.mjs

      # W-49：release 二进制不得残留 QA 注入入口，把 W-47 的本地验收变成常设门禁。
      # 写法要点：grep -c 在 0 命中时自身 exit 1，必须先取计数再判 -ne 0；
      # 每个符号独立断言，失败不提前退出，避免一条掩盖其余。
      # 不能用「非标识符边界」匹配：macOS 二进制里相邻字面量会被合并成
      # webview_positiondiag_write_nameddataset_manifest，边界匹配会漏检（假绿）；
      # 改用子串出现次数，并扣掉更长符号的命中（AKA_DIAG 扣 AKA_DIAG_TARGET/AKA_DIAG_INF，
      # diag_write 扣 diag_write_named）。这样每条断言只归属自己的符号，不会被邻居兜住。
      # 2026-11 QA 复核后扩围：除四个启动参数外，另拦环境变量与诊断写入口/文件名。
      - name: release 注入符号门禁（W-49）
        run: |
          cargo build --release -p aka-desktop
          BIN=target/release/aka-desktop
          strings "$BIN" > /tmp/aka-release-strings.txt
          raw_count() { (grep -a -o -F -- "$1" /tmp/aka-release-strings.txt || true) | wc -l | tr -d ' '; }
          fail=0
          for symbol in \
            "AKA-DIAG-CORRUPT" "--corrupt-db" "--readonly-db" "--empty-dataset" \
            "AKA_DIAG" "AKA_DIAG_TARGET" "AKA_DIAG_INF" \
            "diag_write" "diag_faults" "s2-evidence" "aka/diag"; do
            count=$(raw_count "$symbol")
            # 扣掉更长符号里的同名子串，避免一条断言兜住另一条（漏项实验要能看出来）。
            case "$symbol" in
              "AKA_DIAG") count=$((count - $(raw_count "AKA_DIAG_TARGET") - $(raw_count "AKA_DIAG_INF")));;
              "diag_write") count=$((count - $(raw_count "diag_write_named")));;
            esac
            echo "注入符号 $symbol：$count（期望 0）"
            if [ "$count" -ne 0 ]; then
              fail=1
              echo "::error::release 二进制含注入符号 $symbol（$count 处）"
              echo "--- $symbol 命中行 ---"
              grep -a -n -F -- "$symbol" /tmp/aka-release-strings.txt | head -n 30
            fi
          done
          exit "$fail"

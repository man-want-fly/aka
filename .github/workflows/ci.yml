name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: macOS build / test / golden
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check（含 desktop crate 的图标/context 校验）
        run: cargo check --workspace --all-targets

      - name: cargo test（黄金夹具在 indicator-golden 内，失败即红）
        run: cargo test --workspace --exclude aka-desktop -- --nocapture

      - name: 黄金回归报告（T-03 门禁，失败打印首个偏差下标）
        run: cargo test -p indicator-golden -- --nocapture

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vite build
        run: npm run build

      - name: 前端构建产物存在性
        run: test -f dist/index.html

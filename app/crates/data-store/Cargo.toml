[package]
name = "data-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Sprint-5 AKA-70/73 Parquet 分区持久化

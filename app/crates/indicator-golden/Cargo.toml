[package]
name = "indicator-golden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
indicator-core = { path = "../indicator-core" }
app-core = { path = "../app-core" }
data-provider = { path = "../data-provider" }
data-store = { path = "../data-store" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[bin]]
name = "aka-golden-report"
path = "src/bin/aka-golden-report.rs"

[[bin]]
name = "aka-sim-dataset"
path = "src/bin/aka-sim-dataset.rs"

[[bin]]
name = "aka-aggregate-export"
path = "src/bin/aka-aggregate-export.rs"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

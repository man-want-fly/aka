[workspace]
resolver = "2"
members = [
  "crates/app-core",
  "crates/data-provider",
  "crates/data-store",
  "crates/indicator-core",
  "crates/indicator-golden",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"

[workspace]
resolver = "2"
members = [
  "crates/app-core",
  "crates/data-provider",
  "crates/data-store",
  "crates/indicator-core",
  "crates/indicator-golden",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"

# `tauri dev` 走 dev profile。实测（TD-S0-07 微基准）：同一份 641KB `CalcResponse`，
# `opt-level=0` 序列化 p50=27.30ms，`opt-level=1` 降到 2.36ms（11.5×），
# 命中路径端到端 2.54ms → 0.54ms。保留行号与调试符号，只开基础优化。
[profile.dev]
opt-level = 1
